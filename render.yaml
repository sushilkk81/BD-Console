services:
  - type: web
    name: bd-console-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bd-console-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Replace with the deployed Vercel frontend URL(s), e.g.
      # '["https://bd-console.vercel.app"]'. Must be valid JSON — a bare
      # domain string will fail Settings' list[str] parsing at boot.
      - key: CORS_ORIGINS
        value: '["http://localhost:3000"]'
      - key: ANTHROPIC_API_KEY
        value: ""
      - key: TAVILY_API_KEY
        value: ""

  # Monthly check for a new CMS Part D release. This app has no scheduler runtime; the
  # check is a command, run here by Render's cron service. It only records what CMS
  # publishes — a detected release still goes through the validation workflow before it
  # can be promoted. If this stops running, freshness degrades to unknown rather than
  # continuing to report the data as current.
  - type: cron
    name: bd-console-cms-metadata-check
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    schedule: "0 6 1 * *"
    dockerCommand: python -m app.forecasting_engine.services.sources.cms_metadata_check
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bd-console-db
          property: connectionString

databases:
  - name: bd-console-db
    plan: free
    databaseName: bdconsole
    user: bdconsole
